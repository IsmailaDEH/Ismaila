name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Tests de chaque projet
        run: |
          for p in projets/*/; do
            echo "::group::$p"
            (cd "$p" && python -m pytest -q tests) || exit 1
            echo "::endgroup::"
          done
